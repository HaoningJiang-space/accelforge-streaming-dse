# One dense prefill projection and one single-query decode score contraction.
# The evaluation repeats the latter with a fixed context and cold residency.
workload:
  rank_sizes: {M: 128, K: 256, N: 512, B: 1, D: 64, S: 512}
  bits_per_value: {All: 8}
  einsums:
  - name: Prefill
    tensor_accesses:
    - {name: X, projection: [m, k]}
    - {name: W, projection: [k, n]}
    - {name: P, projection: [m, n], output: True}
    renames: {input: X, weight: W, output: P}
  - name: Decode
    tensor_accesses:
    - {name: Q, projection: [b, d]}
    - {name: KCache, projection: [d, s]}
    - {name: Score, projection: [b, s], output: True}
    renames: {input: Q, weight: KCache, output: Score}
