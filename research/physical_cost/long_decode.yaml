# Fixed-context single-token attention with external K and V.
workload:
  rank_sizes: {B: 1, M: 1, P: {{ CONTEXT }}, H: 4, E: 16, F: 16}
  bits_per_value: {All: 8}
  einsums:
  - name: QK
    tensor_accesses:
    - {name: Q, projection: [b, m, h, e]}
    - {name: K, projection: [b, p, h, e]}
    - {name: Scores, projection: [b, m, p, h], output: True}
    renames: {input: Q, weight: K, output: Scores}
  - name: Normalize
    tensor_accesses:
    - {name: Scores, projection: [b, m, p, h]}
    - {name: Prob, projection: [b, m, p, h], output: True}
    renames: {input: Scores, weight: Nothing, output: Prob}
  - name: AV
    tensor_accesses:
    - {name: Prob, projection: [b, m, p, h]}
    - {name: V, projection: [b, p, h, f]}
    - {name: Value, projection: [b, m, h, f], output: True}
    renames: {input: Prob, weight: V, output: Value}
