name: Physical cost gate

on:
  push:
    branches: [codex/physical-cost-gate]
    paths:
      - ".github/workflows/physical-cost-gate.yml"
      - "research/physical_cost/*.py"
      - "research/physical_cost/*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pinned CACTI
        run: |
          git init "$RUNNER_TEMP/cacti"
          git -C "$RUNNER_TEMP/cacti" fetch --depth 1 https://github.com/HewlettPackard/cacti.git 1ffd8dfb10303d306ecd8d215320aea07651e878
          git -C "$RUNNER_TEMP/cacti" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/cacti" -j2 opt
      - name: Characterize two-level SRAM macros
        run: python -m research.physical_cost.cacti_sram "$RUNNER_TEMP/cacti" "$RUNNER_TEMP/physical-cost"
      - name: Install the native mapper dependencies
        run: |
          python -m pip install -r research/runtime/windows-requirements.txt 'islpy>=2025'
          python -m pip install --no-deps -e .
      - name: Evaluate the mixed workload under the SRAM area budgets
        env:
          ACCELFORGE_CONFIG_PATH: ${{ github.workspace }}/research/runtime/windows_config.yaml
        run: |
          out="$RUNNER_TEMP/physical-cost"
          bash research/tracking_audit/run_capped.sh 4 240 "$out/cold.log" -- \
            python -u -m research.physical_cost.mixed_gate "$out/sram.json" "$out/cold.json"
          bash research/tracking_audit/run_capped.sh 4 240 "$out/resident.log" -- \
            python -u -m research.physical_cost.mixed_gate "$out/sram.json" "$out/resident.json" --context 1024 --resident-kv
          bash research/tracking_audit/run_capped.sh 4 240 "$out/single-bank.log" -- \
            python -u -m research.physical_cost.mixed_gate "$out/sram.json" "$out/single-bank.json" --context 1024 --resident-kv --single-bank-service
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-cost
          path: ${{ runner.temp }}/physical-cost
          retention-days: 30
